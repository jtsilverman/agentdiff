name: "AgentDiff CI"
description: "Compare agent snapshots against baselines and post regression reports"

inputs:
  baseline_path:
    description: "Path to baseline file (e.g., .agentdiff/baselines/main.json.gz)"
    required: false
    default: ""
  fail_on_style_drift:
    description: "Fail CI on text-only regressions (style drift)"
    required: false
    default: "false"
  threshold_tool:
    description: "Tool score threshold for regression (0.0-1.0)"
    required: false
    default: "0.3"
  threshold_text:
    description: "Text score threshold for regression (0.0-1.0)"
    required: false
    default: "0.5"
  threshold_steps:
    description: "Step delta threshold for regression"
    required: false
    default: "5"

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24"

    - name: Install AgentDiff
      shell: bash
      run: go install github.com/jtsilverman/agentdiff@latest

    - name: Add Go bin to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Write config if not present
      shell: bash
      run: |
        if [ ! -f .agentdiff.yaml ]; then
        cat > .agentdiff.yaml << 'AGENTDIFF_EOF'
        thresholds:
          tool_score: ${{ inputs.threshold_tool }}
          text_score: ${{ inputs.threshold_text }}
          step_delta: ${{ inputs.threshold_steps }}
        ci:
          baseline_path: "${{ inputs.baseline_path }}"
          fail_on_style_drift: ${{ inputs.fail_on_style_drift }}
        AGENTDIFF_EOF
        fi

    - name: Run AgentDiff CI
      id: agentdiff
      shell: bash
      run: |
        set +e
        BASELINE_FLAG=""
        if [ -n "${{ inputs.baseline_path }}" ]; then
          BASELINE_FLAG="--baseline ${{ inputs.baseline_path }}"
        fi
        agentdiff ci --output agentdiff-report.md --png-out agentdiff-graph.png $BASELINE_FLAG
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    # On a PR, push the rendered PNG to the `agentdiff-images` orphan branch so
    # the sticky comment can embed it via raw.githubusercontent.com. Requires the
    # consuming workflow to grant `permissions: contents: write`.
    - name: Publish path-graph PNG to orphan branch
      id: publish_png
      if: github.event_name == 'pull_request' && hashFiles('agentdiff-graph.png') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        REPO="${{ github.repository }}"
        SHA="${{ github.event.pull_request.head.sha }}"
        RUN_ID="${{ github.run_id }}"
        FILENAME="${SHA}-${RUN_ID}.png"

        # Stash PNG + report outside the worktree so the branch switch can't lose them.
        TMP=$(mktemp -d)
        cp agentdiff-graph.png "$TMP/$FILENAME"
        cp agentdiff-report.md "$TMP/agentdiff-report.md"

        ORIG_REF=$(git rev-parse --abbrev-ref HEAD)
        if [ "$ORIG_REF" = "HEAD" ]; then
          ORIG_REF=$(git rev-parse HEAD)
        fi

        git config user.email "actions@github.com"
        git config user.name "agentdiff-ci"

        if git fetch origin agentdiff-images 2>/dev/null && git rev-parse --verify origin/agentdiff-images >/dev/null 2>&1; then
          git checkout -B agentdiff-images origin/agentdiff-images
        else
          git checkout --orphan agentdiff-images
          git rm -rf . >/dev/null 2>&1 || true
        fi

        cp "$TMP/$FILENAME" "$FILENAME"
        git add "$FILENAME"
        git commit -m "agentdiff: image for PR ${SHA} run ${RUN_ID}"
        git push origin agentdiff-images

        # Return to the PR head so subsequent steps see the original tree + restore the report.
        git checkout "$ORIG_REF"
        cp "$TMP/agentdiff-report.md" agentdiff-report.md

        RAW_URL="https://raw.githubusercontent.com/${REPO}/agentdiff-images/${FILENAME}"
        echo "graph_url=${RAW_URL}" >> $GITHUB_OUTPUT

    - name: Append PNG to report
      if: github.event_name == 'pull_request' && steps.publish_png.outputs.graph_url != ''
      shell: bash
      run: |
        printf '\n\n## Path graph\n\n![Path graph](%s)\n' "${{ steps.publish_png.outputs.graph_url }}" >> agentdiff-report.md

    - name: Post PR comment
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: agentdiff-report.md
        header: agentdiff

    - name: Exit with AgentDiff result
      shell: bash
      run: |
        if [ "${{ steps.agentdiff.outputs.exit_code }}" = "1" ]; then
          exit 1
        fi
